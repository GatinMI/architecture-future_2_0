# Локальный тестовый стенд для проверки пайплайна (НЕ продакшн-состав):
#   * GitLab CE        - CI/CD, порт 8081
#   * MinIO            - S3-совместимое хранилище для Terraform state,
#                        S3 API на 9000, веб-консоль на 9001
#   * minio-init       - разовый job: ставит mc и создаёт бакет tf-state
#
# Поднять:
#   docker compose up -d

services:
  gitlab:
    image: gitlab/gitlab-ce:19.4.3-ce.0
    container_name: gitlab
    hostname: gitlab.local
    ports:
      - "8081:80"
    environment:
      GITLAB_ROOT_PASSWORD: "homework-2026"   # только для локального теста
    volumes:
      - gitlab_data:/var/opt/gitlab
    shm_size: "256mb"

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "tfstate-ci"
      MINIO_ROOT_PASSWORD: "tfstate-local-secret"
    volumes:
      - minio_data:/data

  minio-init:
    image: alpine:3.21
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "tfstate-ci"
      MINIO_ROOT_PASSWORD: "tfstate-local-secret"
      MC_TAG: "RELEASE.2025-08-13T08-35-41Z"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl
        curl -fsSL -o "/tmp/mc.$$MC_TAG" \
          "https://github.com/minio/mc/releases/download/$$MC_TAG/mc.linux-amd64.$$MC_TAG"
        curl -fsSL -o "/tmp/mc.$$MC_TAG.sha256sum" \
          "https://github.com/minio/mc/releases/download/$$MC_TAG/mc.linux-amd64.$$MC_TAG.sha256sum"
        (cd /tmp && sha256sum -c "mc.$$MC_TAG.sha256sum")
        install -m 0755 "/tmp/mc.$$MC_TAG" /usr/local/bin/mc
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/tf-state
        echo "bucket tf-state ready"

volumes:
  gitlab_data:
  minio_data:

networks:
  default:
    name: tf_ci_net
